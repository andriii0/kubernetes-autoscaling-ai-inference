name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for root in (Path("bench"), Path("lab"), Path("tests")):
              for path in root.rglob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: Check research manifests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(Path("results").glob("**/manifest.json"))
          if not manifests:
              raise SystemExit("No research manifests found")
          for path in manifests:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(manifests)} research manifests")
          PY

      - name: Check local Markdown links
        shell: bash
        run: python tests/check_markdown_links.py

      - name: Run Python tests
        shell: bash
        run: python -m unittest discover -s tests -t .

  browser:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: npm.cmd install --prefix tests/ui

      - name: Run browser checks
        env:
          UI_TEST_PYTHON: python
          UI_TEST_CHANNEL: msedge
        run: npm.cmd test --prefix tests/ui
