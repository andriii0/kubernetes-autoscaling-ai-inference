name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use stable runner temp directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        shell: bash
        run: python -m pip install --disable-pip-version-check ruff==0.17.5

      - name: Check Python quality
        shell: bash
        run: python -m ruff check bench lab tests

      - name: Check Python syntax
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for root in (Path("bench"), Path("lab"), Path("tests")):
              for path in root.rglob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: Check research manifests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(Path("results").glob("**/manifest.json"))
          if not manifests:
              raise SystemExit("No research manifests found")
          for path in manifests:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(manifests)} research manifests")
          PY

      - name: Check local Markdown links
        shell: bash
        run: python tests/check_markdown_links.py

      - name: Build monotonic k6 runtime
        shell: bash
        run: python bench/build_k6.py

      - name: Run Python tests
        shell: bash
        run: python -m unittest discover -s tests -t .

  browser:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use stable runner temp directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        working-directory: tests/ui
        run: npm.cmd install

      - name: Run browser checks
        env:
          UI_TEST_PYTHON: python
          UI_TEST_CHANNEL: msedge
        working-directory: tests/ui
        run: npm.cmd test
